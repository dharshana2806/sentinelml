name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[api,tracking,dev]"
      - run: ruff check sentinelml tests --select E9,F63,F7,F82
      - run: pytest --cov=sentinelml --cov-report=term-missing
      - run: pip install pip-audit && pip-audit --progress-spinner off || true   # advisory security check
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p artifacts && docker build -t sentinelml-api .
# Deployment job (not enabled): push image to ECR via OIDC role, then `aws ecs update-service`. See deploy/aws/README.md
