# Local stack: API + PostgreSQL + MLflow + Streamlit dashboard.   docker compose up --build
# NOTE: written for correctness but NOT executed in the build sandbox (no Docker daemon there).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sentinelml
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U sentinel"], interval: 5s, retries: 10}
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlruns/mlflow.db --default-artifact-root /mlruns/artifacts
    volumes: [mlruns:/mlruns]
    ports: ["5000:5000"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinelml
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      SENTINEL_MLFLOW: "1"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on: {db: {condition: service_healthy}}
    volumes: [artifacts:/app/artifacts/runtime]
    ports: ["8000:8000"]
  dashboard:
    build: {context: ., dockerfile: Dockerfile.dashboard}
    environment: {API_URL: "http://api:8000"}
    depends_on: [api]
    ports: ["8501:8501"]
volumes: {pgdata: {}, mlruns: {}, artifacts: {}}
